<svg width="1100" height="780" viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#2FA84F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#E8A33D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .th { font-size: 13px; font-weight: 500; fill: #1a1a1a; }
    .ts { font-size: 11px; font-weight: 400; fill: #666; }
    .title { font-size: 17px; font-weight: 600; fill: #1a1a1a; }
    .subtitle { font-size: 12px; font-weight: 400; fill: #666; }
    .legend { font-size: 11px; fill: #555; }
    .ann { font-size: 11px; fill: #6b5430; }
    .layertag { font-size: 10px; font-style: italic; fill: #888; }
    .blocktitle { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
  </style>
</defs>

<rect width="1100" height="780" fill="#ffffff"/>

<text class="title" x="550" y="32" text-anchor="middle">Archive-First Context Flow</text>
<text class="subtitle" x="550" y="52" text-anchor="middle">How transient AI interactions become persistent, retrievable working context</text>

<!-- legend -->
<rect x="150" y="64" width="10" height="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.75"/>
<text class="legend" x="165" y="73">Process step</text>
<rect x="300" y="64" width="10" height="10" fill="#EAF7EE" stroke="#2FA84F" stroke-width="0.75"/>
<text class="legend" x="315" y="73">Persistent store</text>
<rect x="480" y="64" width="10" height="10" fill="#FFF6E9" stroke="#E8A33D" stroke-width="0.75"/>
<text class="legend" x="495" y="73">Cross-cutting concern</text>

<!-- PHASE 1: ARCHIVE -->

<!-- Box 1 -->
<text class="layertag" x="65" y="82">AI Clients</text>
<rect x="60" y="90" width="460" height="60" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.75"/>
<text class="th" x="290" y="120" text-anchor="middle" dominant-baseline="central">AI interaction</text>
<line x1="290" y1="150" x2="290" y2="175" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

<!-- Box 2 -->
<text class="layertag" x="65" y="167">Invocation Interface (archive)</text>
<rect x="60" y="175" width="460" height="60" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.75"/>
<text class="th" x="290" y="197" text-anchor="middle" dominant-baseline="central">AI/client builds structured payload</text>
<text class="ts" x="290" y="216" text-anchor="middle" dominant-baseline="central">contract for orchestration</text>
<line x1="290" y1="235" x2="290" y2="260" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

<!-- Box 3 -->
<rect x="60" y="260" width="460" height="60" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.75"/>
<text class="th" x="290" y="290" text-anchor="middle" dominant-baseline="central">Normalize into archive-ready structure</text>
<line x1="290" y1="320" x2="290" y2="345" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

<!-- Box 4 -->
<rect x="60" y="345" width="460" height="60" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.75"/>
<text class="th" x="290" y="375" text-anchor="middle" dominant-baseline="central">Classify by project, source and record type</text>
<line x1="290" y1="405" x2="290" y2="430" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

<!-- Box 5 - merged store + link -->
<rect x="60" y="430" width="460" height="60" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.75"/>
<text class="th" x="290" y="460" text-anchor="middle" dominant-baseline="central">Store and link archive record</text>

<!-- session break -->
<line x1="290" y1="490" x2="290" y2="512" stroke="#378ADD" stroke-width="1.5"/>
<text class="subtitle" x="290" y="522" text-anchor="middle" font-style="italic">— later, in a separate session —</text>
<line x1="60" y1="530" x2="520" y2="530" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="290" y1="530" x2="290" y2="555" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

<!-- PHASE 2: RETRIEVE -->

<!-- Box 6 -->
<text class="layertag" x="65" y="547">Invocation Interface (retrieve)</text>
<rect x="60" y="555" width="460" height="60" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.75"/>
<text class="th" x="290" y="585" text-anchor="middle" dominant-baseline="central">Search or directly request archived record</text>
<line x1="290" y1="615" x2="290" y2="640" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

<!-- Box 7 - emphasized differentiator -->
<text class="layertag" x="65" y="632">Context Layer</text>
<rect x="60" y="640" width="460" height="80" rx="8" fill="#D7EAFB" stroke="#1F6FBF" stroke-width="2"/>
<text class="th" x="290" y="668" text-anchor="middle" dominant-baseline="central" font-weight="600">Retrieve stored archive context</text>
<text class="ts" x="290" y="688" text-anchor="middle" dominant-baseline="central">on explicit request</text>

<!-- Storage: Archive Repository -->
<rect x="620" y="412" width="210" height="50" rx="10" fill="#EAF7EE" stroke="#2FA84F" stroke-width="0.75"/>
<text class="th" x="725" y="431" text-anchor="middle" dominant-baseline="central">Archive Repository</text>
<text class="ts" x="725" y="448" text-anchor="middle" dominant-baseline="central">system of record</text>
<line x1="520" y1="440" x2="620" y2="437" stroke="#2FA84F" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

<!-- Storage: Related Records -->
<rect x="620" y="472" width="210" height="50" rx="10" fill="#EAF7EE" stroke="#2FA84F" stroke-width="0.75"/>
<text class="th" x="725" y="497" text-anchor="middle" dominant-baseline="central">Related Records</text>
<line x1="520" y1="480" x2="620" y2="497" stroke="#2FA84F" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

<!-- Cross-cutting: Orchestration Layer -->
<rect x="890" y="200" width="170" height="305" rx="10" fill="#FFF6E9" stroke="#E8A33D" stroke-width="0.75"/>
<text class="blocktitle" x="975" y="225" text-anchor="middle">Orchestration Layer</text>
<text class="ts" x="975" y="248" text-anchor="middle">Validation, Monitoring</text>
<text class="ts" x="975" y="262" text-anchor="middle">&amp; Error Handling</text>
<line x1="905" y1="278" x2="1045" y2="278" stroke="#E8A33D" stroke-width="0.5"/>

<text class="ann" x="905" y="295">• Validates normalization</text>
<text class="ann" x="905" y="450">• Monitors archive writes</text>
<text class="ann" x="905" y="470">• Flags failed lookups</text>

<!-- spine -->
<line x1="860" y1="260" x2="860" y2="490" stroke="#E8A33D" stroke-width="1" stroke-dasharray="3,3"/>
<circle cx="860" cy="290" r="3" fill="#E8A33D"/>
<line x1="860" y1="290" x2="890" y2="290" stroke="#E8A33D" stroke-width="1"/>
<circle cx="860" cy="460" r="3" fill="#E8A33D"/>
<line x1="860" y1="460" x2="890" y2="460" stroke="#E8A33D" stroke-width="1"/>

<!-- Operational Logs - persistent store (consistent with legend) -->
<line x1="975" y1="505" x2="975" y2="535" stroke="#2FA84F" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
<rect x="890" y="535" width="170" height="55" rx="10" fill="#EAF7EE" stroke="#2FA84F" stroke-width="0.75"/>
<text class="th" x="975" y="562" text-anchor="middle" dominant-baseline="central">Operational Logs</text>

</svg>